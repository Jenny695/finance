name: zhiheng-finance
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      BIND_HOST: 0.0.0.0
      DATA_DIR: /var/data
      PUBLIC_URL: "https://${SITE_HOST:?Set SITE_HOST in .env.production}"
      TRUST_PROXY: "1"
      DROP_PRIVILEGES: "1"
    volumes:
      - ./runtime-data:/var/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - backend
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: "${SITE_HOST:?Set SITE_HOST in .env.production}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./runtime-caddy/data:/data
      - ./runtime-caddy/config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
networks:
  backend:
